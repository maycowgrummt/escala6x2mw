<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folgas das Equipes e Feriados 2025-2027</title>
    <style>
        :root {
            --verde: #4CAF50; --azul: #2196F3; --amarelo: #FFA000; --vermelho: #F44336; --feriado: #9C27B0;
            --bg-color: #f9f9f9; --text-color: #333; --card-bg: #ffffff;
            --card-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        h1 { text-align: center; }
        .calendar-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .month { background: var(--card-bg); border-radius: 8px; padding: 15px; width: 260px; box-shadow: var(--card-shadow); }
        .month h3 { text-align: center; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day { padding: 6px; text-align: center; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .verde { background-color: var(--verde); color: white; }
        .azul { background-color: var(--azul); color: white; }
        .amarelo { background-color: var(--amarelo); color: white; }
        .vermelho { background-color: var(--vermelho); color: white; }
        .feriado { background-color: var(--feriado); color: white; }
    </style>
</head>
<body>
    <h1>Escala de Folgas 2025-2027</h1>
    <div class="calendar-container" id="calendarContainer"></div>

    <script>
        const holidays = {
            '2025-01-01': 'Confraternização', '2025-03-03': 'Carnaval', '2025-03-04': 'Carnaval', '2025-04-18': 'Sexta-feira Santa', '2025-04-21': 'Tiradentes', '2025-05-01': 'Dia do Trabalho', '2025-06-19': 'Corpus Christi', '2025-09-07': 'Independência', '2025-10-12': 'N. S. Aparecida', '2025-11-02': 'Finados', '2025-11-15': 'Proclamação da República', '2025-12-25': 'Natal',
            '2026-01-01': 'Confraternização', '2026-02-16': 'Carnaval', '2026-02-17': 'Carnaval', '2026-04-03': 'Sexta-feira Santa', '2026-04-21': 'Tiradentes', '2026-05-01': 'Dia do Trabalho', '2026-06-04': 'Corpus Christi', '2026-09-07': 'Independência', '2026-10-12': 'N. S. Aparecida', '2026-11-02': 'Finados', '2026-11-15': 'Proclamação da República', '2026-12-25': 'Natal',
            '2027-01-01': 'Confraternização', '2027-02-08': 'Carnaval', '2027-02-09': 'Carnaval', '2027-03-26': 'Sexta-feira Santa', '2027-04-21': 'Tiradentes', '2027-05-01': 'Dia do Trabalho', '2027-05-27': 'Corpus Christi', '2027-09-07': 'Independência', '2027-10-12': 'N. S. Aparecida', '2027-11-02': 'Finados', '2027-11-15': 'Proclamação da República', '2027-12-25': 'Natal'
        };

        function getTeamColor(date) {
            const startDate = new Date('2025-07-25');
            const diffTime = Math.floor((date - startDate) / (1000 * 60 * 60 * 24));
            const cycle = Math.floor(diffTime / 2) % 4;
            const colors = ['verde', 'azul', 'amarelo', 'vermelho'];
            return colors[cycle];
        }

        const container = document.getElementById('calendarContainer');
        for (let year = 2025; year <= 2027; year++) {
            for (let month = 0; month < 12; month++) {
                const monthEl = document.createElement('div');
                monthEl.className = 'month';
                monthEl.innerHTML = `<h3>${new Date(year, month).toLocaleString('pt-BR', {month: 'long'})} ${year}</h3><div class="days"></div>`;
                container.appendChild(monthEl);
                
                const daysEl = monthEl.querySelector('.days');
                const lastDay = new Date(year, month + 1, 0).getDate();
                for (let d = 1; d <= lastDay; d++) {
                    const date = new Date(year, month, d);
                    const dateKey = date.toISOString().split('T')[0];
                    const dayEl = document.createElement('div');
                    dayEl.className = 'day ' + (holidays[dateKey] ? 'feriado' : getTeamColor(date));
                    dayEl.textContent = d;
                    dayEl.title = holidays[dateKey] || '';
                    daysEl.appendChild(dayEl);
                }
            }
        }
    </script>
</body>
</html>
